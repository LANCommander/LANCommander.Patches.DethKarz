# Builds on every push and pull request. A semver tag (v1.2.3, v1.2.3-rc.1) also publishes a GitHub release
# with the standalone patch and the LANCommander Interposer plugin.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-gcc zip

      - name: Check tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' \
            || { echo "::error::$GITHUB_REF_NAME is not a semver tag (vMAJOR.MINOR.PATCH)"; exit 1; }

      - name: Build
        run: sh build.sh

      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          mkdir -p out/standalone out/interposer/.interposer/Plugins
          cp build/dinput.dll dist/dkpatch.ini README.md out/standalone/
          cp build/LANCommander.Interposer.Plugin.Dethkarz.dll out/interposer/.interposer/Plugins/
          cp docs/interposer.md out/interposer/
          (cd out/standalone && zip -qr "../dkpatch-$version.zip" .)
          (cd out/interposer && zip -qr "../LANCommander.Interposer.Plugin.Dethkarz-$version.zip" .)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dkpatch-${{ env.VERSION }}
          path: out/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/*.zip --title "$GITHUB_REF_NAME" --generate-notes $flags
