; dkpatch for DethKarz (GOG Dethkarz.exe). Install: copy dinput.dll and this file next to
; Dethkarz.exe. Uninstall: delete them. dkpatch.log shows what was applied.

[General]
Enabled=1

[Net]
; How many resend requests (one per Timeout, 125 ms unless the host's ping is high) a machine
; sends to a silent player before the "Connection timeout / Waiting on ..." box opens. The
; original 15 opens it after about 2 s. Only the host's setting counts. 0 = don't touch.
Retries=40
; The original "Waiting on ..." box stops all resending, so once every player is stuck in it
; the race never recovers and someone has to abort. 1 = keep resending while it is open (the
; box then closes by itself when the connection comes back).
ResendWhileWaiting=1
; When DirectPlay reports that a player left or the session was lost, the original game did
; nothing and the race froze. 1 = the host drops that player; a client whose host is gone
; leaves as if the host had quit.
HandlePlayerLoss=1
; The game read ClientSkipThresh (below) as 0/1 instead of its value. 1 = use the value.
FixClientSkipThresh=1
; Hosts only: create the session with DirectPlay keep-alive, so a player whose game crashed or
; whose connection is gone for good is noticed by DirectPlay (after about 1.5 minutes) and
; dropped from the race automatically (needs HandlePlayerLoss=1). Without it the race waits in
; the "Waiting on ..." box until someone picks CANCEL.
DirectPlayKeepAlive=1
; The game's frame timer wrapped every ~7 minutes (and its microseconds after ~72): a slow moment or a
; loading pause across a wrap froze a network race with "Waiting on ..." for minutes. 1 = 64-bit timer and
; wrap-safe frame pacing.
FixTimerWrap=1
; DragNet's own tuning, which the game read from the registry (HKLM\SOFTWARE\Melbourne House\DethKarZ\Network);
; the registry is no longer read. Retries above is one of them. Only the host's values count (clients take the
; host's). The values below are the game's defaults; a key left out keeps its default too.
; 1 = tune Ratio, Lead and Timeout from the measured ping when a race starts (overrides the three below).
UseAuto=1
; Game frames per input block (1..8) and input blocks sent ahead (1..8).
Ratio=1
Lead=1
; Silence in ms before a player is asked to resend (125..3000).
Timeout=125
; Host: DragNet's keep-alive interval in ms and how many may go unanswered.
KeepAliveTimeOut=5000
KeepAliveRetries=6
; Minimum game packet size in bytes (0..100; padding).
MinPacketSize=0
; 1 = a client merges button presses over an input block.
UseBumpUpEvents=1
; 1 = the host waits for a stalled client indefinitely; 0 = it skips the client after ClientSkipThresh frames.
ClientWait=1
ClientSkipThresh=2
; Debugging: delay received messages by FakeLatencyMs.
UseFakeLatency=0
FakeLatencyMs=0

[Widescreen]
; Adds 856x480 (Glide's only widescreen mode) to the Glide renderer's resolution list, and keeps
; any renderer's list within what the game can hold (50 modes; Direct3D lists every display mode).
; Pick the mode in Options - Graphics.
Modes=1
; The field of view is horizontal, so on a wide screen the original showed less above and below.
; 1 = keep the 4:3 vertical view and see more at the sides (Hor+).
HorPlusFov=1
; The original HUD stays 640x480-sized at higher resolutions. 1 = scale it with the screen height
; (keeping its proportions; it stays anchored to the screen edges at any aspect ratio).
ScaleHud=1
; The menus (and the pause menu and dialogs in a race) are laid out for 640x480. 1 = show them at
; 4:3 in the middle of a wide screen with black bars, instead of stretched.
CenterMenus=1
; Size of the race minimap (bottom right) in percent. The game draws every track at one fixed scale, small
; next to the rest of the HUD; 100 = original.
MinimapScale=140

[Video]
; The opening movie (data\fmv\dk_intro.vbc) is the one thing the game displays by switching the
; monitor into a 640x480 8-bit fullscreen mode itself (not through nGlide). Modern monitors often
; reject that mode at startup ("signal out of range / not supported"), before you can skip it. The
; rest of the game renders through nGlide, which presents at your desktop resolution. 1 = skip the
; opening movie and go straight to the menus (recommended on modern displays). 0 = keep it.
SkipIntro=1
; The first time the game starts it asks for a graphics device and mode. 1 = skip that dialog and use the
; Glide renderer (OpenGL, see [OpenGL]) at your desktop resolution; change it later in Options - Graphics.
; Starting the game with -c still opens the dialog.
SkipDeviceDialog=1
; The chosen graphics device is stored here (the game kept it in the registry), written by the game:
; Device = the renderer DLL in Device Libraries, DeviceWidth/DeviceHeight/DeviceBpp = the mode it was chosen
; with, DeviceData = the rest of the game's record in hex (empty for Glide). Delete Device to be asked again.

[Graphics]
; How far away cars keep their detailed models, in percent of the original distances (25..1000). The game
; swaps in low-detail models by distance, not by how big a car is on screen, so at high resolutions distant
; cars look blocky. 100 = original (with HorPlusFov the distances stay those of a 4:3 screen), 400 = cars keep
; their detail four times as far, 0 = always the most detailed model. In the menu this is part of the game's
; "car LOD" option (Options - Graphics - Customise Performance): maximum (0), ultra (1000), very high (400),
; high (100, the original), medium and low (fewer detailed models loaded, 100).
VehicleDrawDistance=400
; 1 = Options - Graphics shows MAX FRAMERATE (MaxFps) in place of the game's frame rate option (the game
; always ticks at 60 Hz with the patch) and, with the OpenGL renderer, the [OpenGL] settings below (fullscreen,
; antialiasing, supersampling, anisotropic filtering), and the "car LOD" row of Customise Performance includes
; the vehicle draw distance. OK applies them at once and writes them into this file. 0 = the game's original
; menus (its frame rate option then does nothing).
MenuOptions=1
; Max framerate in races. The game runs at a fixed 60 game ticks per second, network games too (every player
; needs the patch; others get "Wrong game version"), and frames are drawn between the ticks with the cars,
; camera, sprites and particles interpolated between the last two ticks, so motion is smooth at high refresh
; rates. The picture runs one tick (17 ms) behind the game; the game itself runs exactly as at 60. 0 = the
; desktop refresh rate, -1 = no limit, 60 = one frame per tick as the original, or frames per second at most.
; Glide renderers only (OpenGL or nGlide). Also in Options - Graphics (MAX FRAMERATE, with MenuOptions=1).
MaxFps=0
; Experimental, changes how the game plays: game ticks per second in single-player races instead of 60, every
; frame a real game step. -1 = the desktop refresh rate (lowered to a whole fraction of it if frames keep missing
; the refresh), or a rate in Hz (60 or more). Car speeds and timers are scaled to match 60. MaxFps does nothing
; while this is set. 0 = off. (TickRate, written by the HIGH REFRESH RATE row of earlier versions, is ignored.)
ExperimentalTickRate=0

[Players]
; Players per network game, 8..16 (the original limit is 8). The lobby then lists up to 16 rows in
; the space of 8 (13..16 players: smaller rows). Every player needs the patch with the same value:
; anyone else is refused with "Wrong game version". Humans + AI cars stay at most 20, so 16 players
; leave room for 4 AI cars. 8 = original behaviour.
MaxPlayers=12
; Longest player name, 12..31 (the original allows 12). Names above 18 characters run into the
; car icons in the lobby and into the label on the network screen. Race records and the best-lap
; ghost keep their own limits (15 and 12 characters) and store the name cut short.
NameLength=18

[Gamepad]
; 1 = modern controllers (Xbox, PlayStation, Switch Pro and others) go through SDL instead of the
; game's DirectInput joystick code: analog steering on the left stick (the original steered pads
; digitally), RT/LT accelerate/brake, the D-pad steers and navigates, A selects in the menus, B goes
; back, Start pauses a race. Text fields: A on a field, then up/down cycle the letter, right = next, left =
; delete, X space, Y dot, A done. In the network lobby Y = ready. In a race X deploys a powerup and Y is the
; rear view by default (Options - Control changes them). Pads can be plugged in while the game runs. Choose the joystick as your
; controller in the game's options (the first pad is joystick 1, after any wheel or other
; joystick, which stay as they were). 0 = original behaviour.
UseSDL=1
; Left stick dead zone in percent (the game's own dead zone option applies too, the larger wins).
Deadzone=10
; 1 = the triggers accelerate (RT) and brake (LT) in a race. 0 = the left stick does, like a
; joystick (push up to accelerate).
TriggerThrottle=1
; 1 = the game's force feedback (collisions, losing control) rumbles a gamepad. Wheels and joysticks with
; real force feedback keep using theirs. RumbleStrength is a percentage of the full motor power.
Rumble=1
RumbleStrength=100
; 1 = the first time a gamepad is used in the menus while the controller option is still the keyboard,
; the gamepad becomes the controller (otherwise it has to be chosen in Options - Control). Only once per
; session, so a later choice of the keyboard sticks.
AutoSelect=1

[Saves]
; Where the game keeps what it writes. The original saves into its install folder (Data\dk.db: options, race
; records and championship progress; savegame*.dks; ghosts and replays), which breaks in a read-only or
; Program Files install and mixes users. 1 = use %USERPROFILE%\Saved Games\Beam Software\DethKarz instead.
; The first time, dk.db and the savegames are copied over from the install folder. (The renderer choice and
; the network tuning, which the game kept in the registry, are in this file: [Video] and [Net].)
Redirect=1
; Use this folder instead (environment variables like %USERPROFILE% work). Empty = the Saved Games folder.
Folder=

[OpenGL]
; 1 = render through OpenGL (dkpatch\glide2x.dll, which has to sit in a dkpatch folder next to Dethkarz.exe)
; instead of nGlide, when the game's renderer is Glide (the default). Every resolution the desktop can show is
; offered in Options - Graphics, and the game draws at that resolution natively. Alt+Enter switches between
; fullscreen and a window. 0 = nGlide as before.
UseOpenGL=1
; 1 = borderless fullscreen on the game's monitor (the frame keeps its aspect, with black bars if it differs);
; 0 = start in a window.
Fullscreen=1
; VSync is the game's own "video sync" option (Options - Graphics - Customise Performance).
; Antialiasing samples (0, 2, 4, 8).
MSAA=4
; Render at this multiple of the screen resolution and scale down (1 = off, 2 = 4x the pixels).
Supersample=1
; 1 = trilinear filtering where the game asks for bilinear and mipmapping (its "bilinear" and "mipmapping"
; options in Customise Performance), plus anisotropic filtering at this many samples (1 = off, up to 16:
; sharper distant textures).
SmoothTextures=1
Anisotropy=16
