; dkpatch for DethKarz (GOG Dethkarz.exe). Install: copy dinput.dll and this file next to
; Dethkarz.exe. Uninstall: delete them. dkpatch.log shows what was applied.

[General]
Enabled=1

[Net]
; How many resend requests (one per Timeout, 125 ms unless the host's ping is high) a machine
; sends to a silent player before the "Connection timeout / Waiting on ..." box opens. The
; original 15 opens it after about 2 s. Only the host's setting counts. 0 = don't touch.
Retries=40
; The original "Waiting on ..." box stops all resending, so once every player is stuck in it
; the race never recovers and someone has to abort. 1 = keep resending while it is open (the
; box then closes by itself when the connection comes back).
ResendWhileWaiting=1
; When DirectPlay reports that a player left or the session was lost, the original game did
; nothing and the race froze. 1 = the host drops that player; a client whose host is gone
; leaves as if the host had quit.
HandlePlayerLoss=1
; Registry setting ClientSkipThresh was read as 0/1 instead of its value (only matters if
; you set it under HKLM\SOFTWARE\WOW6432Node\Melbourne House\DethKarZ\Network).
FixClientSkipThresh=1
; Hosts only: create the session with DirectPlay keep-alive, so a player whose game crashed or
; whose connection is gone for good is noticed by DirectPlay (after about 1.5 minutes) and
; dropped from the race automatically (needs HandlePlayerLoss=1). Without it the race waits in
; the "Waiting on ..." box until someone picks CANCEL.
DirectPlayKeepAlive=1

[Widescreen]
; Adds 856x480 (Glide's only widescreen mode) to the Glide renderer's resolution list, and keeps
; any renderer's list within what the game can hold (50 modes; Direct3D lists every display mode).
; Pick the mode in Options - Graphics.
Modes=1
; The field of view is horizontal, so on a wide screen the original showed less above and below.
; 1 = keep the 4:3 vertical view and see more at the sides (Hor+).
HorPlusFov=1
; The original HUD stays 640x480-sized at higher resolutions. 1 = scale it with the screen height
; (keeping its proportions; it stays anchored to the screen edges at any aspect ratio).
ScaleHud=1
; The menus (and the pause menu and dialogs in a race) are laid out for 640x480. 1 = show them at
; 4:3 in the middle of a wide screen with black bars, instead of stretched.
CenterMenus=1

[Players]
; Players per network game, 8..12 (the original limit is 8). The lobby then lists 12 rows in the
; space of 8. Every player needs the patch with the same value: anyone else is refused with
; "Wrong game version". 8 = original behaviour.
MaxPlayers=12
; Longest player name, 12..31 (the original allows 12). Names above 18 characters run into the
; car icons in the lobby and into the label on the network screen. Race records and the best-lap
; ghost keep their own limits (15 and 12 characters) and store the name cut short.
NameLength=18
